<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/images/icon-dice.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Advice Generator</title>
</head>
<body>
    <main class="main">
        <div class="generator">
            <div class="generator__texts">
                <p class="generator__title">ADVICE #<span id="number-advice"></span></p>
                <blockquote class="generator__cite">
                    <p>"<span id="advice"></span>"</p>
                </blockquote>
                <figure>
                    <picture>
                        <source media="(min-width: 1024px)" srcset="./assets/images/pattern-divider-desktop.svg">
                        <img src="./assets/images/pattern-divider-mobile.svg" alt="Device">
                    </picture>
                </figure>
            </div>
            <button class="generator__qr" id="qr">
                <img src="./assets/images/icon-dice.svg" alt="Device">
            </button>
        </div>
    </main>

    <script src="./scripts/generate.js"></script>
</body>
</html>
